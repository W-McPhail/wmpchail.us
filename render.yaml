# Render Blueprint — https://render.com/docs/blueprint-spec
# Creates one web service (Express API + built React client) and one Postgres database.
services:
  - type: web
    name: wmcphail-us
    runtime: node
    plan: free            # bump to "starter" to avoid cold starts once you're job-hunting in earnest
    region: ohio
    buildCommand: npm ci --include=dev && npm run build   # --include=dev: Render sets NODE_ENV=production, which would skip vite/tsc
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: wmcphail-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false        # set in the Render dashboard
      - key: CONTACT_EMAIL
        value: mcphailwillow@gmail.com
      - key: CONTACT_PHONE
        value: "+19148061544"
      - key: RESEND_API_KEY
        sync: false        # https://resend.com — free tier is plenty
      - key: RESEND_FROM
        value: "Willow McPhail <onboarding@resend.dev>"   # change once your domain is verified in Resend
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false

databases:
  - name: wmcphail-db
    plan: free            # free Postgres expires after 90 days on Render; upgrade to "basic-256mb" to keep it
    region: ohio
    databaseName: wmcphail
    user: wmcphail
